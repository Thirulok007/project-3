<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My CI/CD Pipeline Project</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #0b1f26, #2a5568);
      color: #fff;
    }
    h1 { font-size: 2.5rem; margin-bottom: 0.6rem; }
    .subtitle { color: #cbd5e1; margin-bottom: 2rem; }
    .tools {
      display: flex;
      flex-wrap: wrap;
      gap: 0.8rem;
      justify-content: center;
      margin-bottom: 2rem;
    }
    .tool {
      padding: 0.8rem 1.4rem;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.2);
      font-weight: 600;
    }
    .status {
      display: inline-block;
      padding: 0.7rem 1.5rem;
      border-radius: 999px;
      background: #22c55e;
      color: #052e16;
      font-weight: 700;
      margin-bottom: 2rem;
    }
    footer { color: #cbd5e1; font-size: 0.9rem; }
  </style>
</head>
<body>
  <h1>🚀 My CI/CD Pipeline Project</h1>
  <p class="subtitle">Automated build, push and deploy with Docker, Jenkins and AWS</p>

  <div class="tools">
    <div class="tool">GitHub</div>
    <div class="tool">Jenkins</div>
    <div class="tool">Docker Hub</div>
    <div class="tool">AWS EC2</div>
    <div class="tool">Monitoring</div>
  </div>

  <div class="status">● Application is running</div>

  <footer>Built by Thirulok | GUVI x HCL DevOps Project</footer>
</body>
</html>
