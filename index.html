<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My DevOps Project</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: linear-gradient(135deg, #0f2027, #203a43, #2c5364); color: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; }
    h1 { font-size: 2.6rem; margin-bottom: 10px; }
    p.sub { font-size: 1.1rem; opacity: 0.85; margin-bottom: 40px; }
    .pipeline { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; margin-bottom: 40px; }
    .step { background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.25); border-radius: 12px; padding: 16px 22px; font-weight: 600; }
    .badge { background: #22c55e; color: #04260f; padding: 8px 18px; border-radius: 999px; font-weight: 700; }
    footer { margin-top: 40px; font-size: 0.9rem; opacity: 0.7; }
  </style>
</head>
<body>
  <h1>🚀 My CI/CD Pipeline Project</h1>
  <p class="sub">Automated build, push and deploy with Docker, Jenkins and AWS</p>
  <div class="pipeline">
    <div class="step">GitHub</div>
    <div class="step">Jenkins</div>
    <div class="step">Docker Hub</div>
    <div class="step">AWS EC2</div>
    <div class="step">Monitoring</div>
  </div>
  <span class="badge">● Application is running</span>
  <footer>Built by YOUR_NAME | GUVI x HCL DevOps Project</footer>
</body>
</html>
